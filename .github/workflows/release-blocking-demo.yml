
name: SchemaSync Release Blocking Demo

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  migration-validation:
    name: Simulated Migration Failure
    runs-on: ubuntu-latest
    steps:
      - name: Simulate a failed migration
        run: |
          echo "Simulating a migration validation failure"
          exit 1

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: migration-validation
    steps:
      - name: Confirm release
        run: echo "This should not run after migration validation fails"
